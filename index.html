<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 0 10px; }
        .input-group { margin-bottom: 10px; display: flex; gap: 5px; flex-wrap: wrap; }
        input, select, button { padding: 8px; }
        .tarefa-item { border-left: 5px solid; background: #f4f4f4; margin: 10px 0; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Lista de Tarefas</h1>
    
    <div class="input-group">
        <input type="text" id="nome" placeholder="Tarefa">
        <input type="text" id="desc" placeholder="Descrição">
        <select id="status">
            <option value="Disponível">Disponível</option>
            <option value="Fazendo">Fazendo</option>
            <option value="Feita">Feita</option>
        </select>
        <button onclick="App.cadastrar()">Adicionar</button>
    </div>

    <div id="lista"></div>

    <script src="tarefas.js"></script>
</body>
</html>
