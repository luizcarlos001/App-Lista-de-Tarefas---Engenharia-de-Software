<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tarefas GoF</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
        .form { display: flex; gap: 10px; margin-bottom: 20px; }
        .tarefa-card { 
            border: 1px solid #ddd; padding: 10px; margin-bottom: 5px;
            display: flex; justify-content: space-between; align-items: center;
            border-radius: 4px;
        }
        .status-Feita { background-color: #d4edda; color: #155724; }
        .status-Fazendo { border-left: 5px solid #007bff; }
    </style>
</head>
<body>

    <h2>App Lista de Tarefas</h2>
    
    <div class="form">
        <input type="text" id="inputNome" placeholder="Tarefa">
        <input type="text" id="inputDesc" placeholder="Descrição">
        <button onclick="adicionarPelaUi()">Adicionar</button>
    </div>

    <div id="listaTarefas"></div>

    <script src="logic.js"></script>
    <script src="ui.js"></script>
</body>
</html>
