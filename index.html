<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lista de Tarefas</title>
</head>
<body>
    <h1>Lista de Tarefas</h1>
    
    <input type="text" id="nome" placeholder="Tarefa">
    <input type="text" id="desc" placeholder="Descrição">
    <select id="status">
        <option value="Disponível">Disponível</option>
        <option value="Fazendo">Fazendo</option>
        <option value="Feita">Feita</option>
    </select>
    <button onclick="App.cadastrar()">Adicionar</button>

    <div id="lista"></div>

    <script src="tarefas.js"></script>
</body>
</html>
